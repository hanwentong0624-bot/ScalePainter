[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalepainter"
version = "0.1.0"
description = "Training-free next-scale image inpainting with Infinity"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "Pillow", "scipy"]

[project.scripts]
scalepainter = "scalepainter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scalepainter*", "infinity*"]
